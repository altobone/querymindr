kind = "mobile"
previewPath = "/loft-mobile/"
title = "The Loft Mobile"
version = "1.0.0"
id = "artifacts/loft-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/loft-mobile/" ]
localPort = 20058

[services.development]
run = "pnpm --filter @workspace/loft-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/loft-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/loft-mobile", "run", "serve" ]

[services.env]
PORT = "20058"
BASE_PATH = "/loft-mobile/"
